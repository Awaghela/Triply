[package]
name = "triply-backend"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = { version = "0.7", features = ["ws", "macros"] }
axum-extra = { version = "0.9", features = ["typed-header"] }
tokio = { version = "1", features = ["full"] }
tower = { version = "0.4", features = ["util"] }
tower-http = { version = "0.5", features = ["cors", "trace", "fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "json", "bigdecimal", "migrate"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
# Pinned to the SAME major version sqlx 0.7's "bigdecimal" feature depends
# on internally (sqlx-postgres requires bigdecimal ^0.3). If these diverge,
# Cargo resolves two separate copies of the crate -- bigdecimal 0.3's
# BigDecimal and bigdecimal 0.4's BigDecimal are different, unrelated types
# to the compiler, so sqlx's Type/Encode/Decode impls (written against 0.3)
# don't apply to our 0.4 structs. Keep this in lockstep with whatever sqlx's
# own bigdecimal requirement is if you ever bump the sqlx version.
bigdecimal = { version = "0.3", features = ["serde"] }
jsonwebtoken = "9"
argon2 = "0.5"
rand = "0.8"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
dotenvy = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "1"
anyhow = "1"
validator = { version = "0.18", features = ["derive"] }
async-trait = "0.1"

[dev-dependencies]
reqwest = { version = "0.12", features = ["json"] }
